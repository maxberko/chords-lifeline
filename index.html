<meta charset="utf-8">
<title>Chords Lifeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Music&display=swap">
<style>
:root{
  --paper:#ffffff; --ink:#161616; --ink-2:#5c5c5c; --ink-3:#9c9c9c; --rule:#e2e2e2;
  --major:#c93a28; --minor:#1f5fbf; --here:#ffd200;
  --display:'Hammersmith One','Gill Sans','Trebuchet MS',sans-serif;
  --sans:'Barlow','Helvetica Neue',Arial,sans-serif;
  --cond:'Barlow Semi Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
/* top bar: a station sign */
.bar{background:var(--ink);color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;padding:0 22px;min-height:64px}
.bar h1{font:400 21px/1 var(--display);margin:0;letter-spacing:.01em;white-space:nowrap}
.now{display:flex;align-items:baseline;gap:16px;min-width:0;overflow:hidden}
.now .chord{font:400 34px/1 var(--display);white-space:nowrap}
.now .chord.none{color:#9a9a9a;font-size:18px;font-family:var(--sans);font-weight:500}
.now .chord .ext{font-size:.58em;margin-left:2px;vertical-align:.35em}
.now .acc,.now .sev .acc{font-family:'Noto Music',serif;font-size:.92em}
.now .role{font:500 15px/1.3 var(--sans);color:#fff;white-space:nowrap}
.now .role b{font:600 13px var(--cond);letter-spacing:.06em;color:#fff;margin-right:6px}
.now .sev{display:flex;gap:10px;font:600 14px/1.3 var(--sans);color:#fff;white-space:nowrap;min-width:0;overflow:hidden}
.now .sev::before{content:'7ths that fit';color:#9a9a9a;margin-right:4px}
.now .sev.none{display:none}
.now .sev span{white-space:nowrap} .now .sev i{font-style:normal;color:#9a9a9a;font-size:12.5px;margin-left:4px}
.ctl{display:flex;align-items:center;gap:18px;white-space:nowrap}
.ctl label{display:flex;flex-direction:column;gap:1px;font:500 11px/1.2 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:#bdbdbd}
.ctl select{appearance:none;-webkit-appearance:none;font:600 14px var(--sans);color:#fff;background:transparent;border:0;border-bottom:1.5px solid #6a6a6a;padding:2px 18px 3px 0;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#bdbdbd 50%),linear-gradient(135deg,#bdbdbd 50%,transparent 50%);background-position:right 6px top 9px,right 1px top 9px;background-size:5px 5px;background-repeat:no-repeat}
.ctl select:focus-visible{outline:2px solid var(--here);outline-offset:3px}
.ctl button{font:600 14px var(--sans);border:0;border-radius:3px;padding:9px 14px;cursor:pointer;background:transparent;color:#fff;border:1.5px solid #6a6a6a}
.ctl button:hover{border-color:#fff}
.ctl button#micBtn{background:var(--here);color:var(--ink);border-color:var(--here);padding:11px 22px;font-size:15px}
.ctl .status{font:500 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:#9a9a9a;white-space:nowrap} .ctl .status.live{color:var(--here)} .ctl .status.err{color:#ff8a80;text-transform:none;letter-spacing:0;font:500 12px var(--sans);max-width:260px;white-space:normal}
.ctl button#micBtn.on{background:#fff;border-color:#fff}
.ctl button:focus-visible{outline:2px solid var(--here);outline-offset:3px}
.ctl .quiet{display:flex;align-items:center;gap:14px}
.ctl .quiet label{flex-direction:row;align-items:center;gap:6px}
.ctl input[type=range]{width:90px;accent-color:#fff}
.ctl input[type=checkbox]{accent-color:#fff;width:14px;height:14px;margin:0}
/* map */
.stage{position:relative;min-height:0;background:var(--paper)}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.trunk{stroke:var(--ink);stroke-width:6;stroke-linecap:butt}
.trunk.fade{stroke-dasharray:3 9;opacity:.35}
.st{cursor:pointer} .st .tick{stroke:var(--ink);stroke-width:3;stroke-linecap:butt}
.st .name{font:400 16px var(--display);fill:var(--ink-2);text-anchor:middle}
.st .num{font:600 11px var(--cond);fill:var(--ink-3);text-anchor:middle;letter-spacing:.06em}
.acc{font-family:'Noto Music',serif;font-size:.92em}
.sup{font-size:.66em;baseline-shift:super}
.st:hover .tick{stroke:var(--here)} .st:hover .name{text-decoration:underline}
.here .ring{fill:#fff;stroke:var(--ink);stroke-width:6}
.here .dot{fill:var(--here)}
.here .name{font:400 24px var(--display);fill:var(--ink);text-anchor:middle}
.here .num{font:600 12px var(--cond);fill:var(--ink-2);text-anchor:middle;letter-spacing:.08em}
.br{cursor:pointer}
.br path{fill:none;stroke-linejoin:round;stroke-linecap:butt}
.br.inkey path{stroke:var(--ink)} .br.colour path{stroke:var(--major)}
.br .stop{stroke-width:2.5;stroke-linecap:butt} .br.inkey .stop{stroke:var(--ink)} .br.colour .stop{stroke:var(--major)}
.spine{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:butt}
.ruler{stroke:var(--ink);stroke-width:1;opacity:.1} .rulerbase{stroke:var(--ink-3);stroke-width:1} .rulerlbl{font:600 11px var(--cond);fill:var(--ink-3);text-anchor:middle;letter-spacing:.04em} .rulertitle{font:600 11px var(--cond);fill:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.br .end{stroke:none} .br.inkey .end{fill:var(--ink)} .br.colour .end{fill:var(--major)}
.br .name{font:400 18px var(--display);fill:var(--ink)}
.br .num{font:600 11px var(--cond);fill:var(--ink-2);letter-spacing:.06em}
.br.tail .name{fill:var(--ink-2);font-size:15px} .br.tail .num{fill:var(--ink-3)}
.br .why{font:500 12px var(--sans);fill:var(--ink-2);opacity:0;transition:opacity .12s}
.br:hover .why,.br:focus-visible .why{opacity:1}
.br:hover .name,.br:focus-visible .name{text-decoration:underline} .br:hover .end,.br:focus-visible .end{fill:var(--here);stroke:var(--ink);stroke-width:2}
.br.hidden{display:none}
.empty{font:500 17px var(--sans);fill:var(--ink-3);text-anchor:middle;dominant-baseline:central}
.enter{animation:enter .35s ease-out both}
@keyframes enter{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
/* readout */
.foot{display:flex;gap:28px;align-items:center;padding:8px 22px 10px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2);min-height:38px}
.foot #readout{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.foot #readout b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:18px;align-items:center;white-space:nowrap;font:500 12px var(--sans);color:var(--ink-2)}
.legend i{display:inline-block;width:22px;height:5px;vertical-align:middle;margin-right:6px;border-radius:1px} .legend i.ink{background:var(--ink)} .legend i.maj{background:var(--major)} .legend i.here{width:10px;height:10px;border-radius:50%;background:var(--here);border:2px solid var(--ink);box-sizing:content-box;vertical-align:-2px}
.foot .quiet{display:flex;gap:16px;align-items:center;white-space:nowrap;font:500 12px var(--sans);color:var(--ink-2)} .foot .quiet label{display:flex;align-items:center;gap:6px} .foot input[type=range]{width:90px;accent-color:var(--ink)} .foot input[type=checkbox]{accent-color:var(--ink);width:14px;height:14px;margin:0}
@media (max-width:1000px){
  .bar{grid-template-columns:1fr auto;grid-template-rows:auto auto;row-gap:8px;padding:10px 16px}
  .now{grid-column:1/-1;flex-wrap:wrap;gap:8px 14px}
  .ctl .quiet{display:none}
}
@media (max-width:700px){ .stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch} .stage svg{position:relative;inset:auto;height:100%;width:auto;display:block} }
@media (max-width:640px){ .now .sev{display:none} .ctl{gap:10px} .ctl label{display:none} .legend,.foot .quiet{display:none} }
</style>

<div class="app">
  <header class="bar">
    <h1>Chords Lifeline</h1>
    <div class="now">
      <div class="chord none" id="chordName">—</div>
      <div class="role" id="chordRole">Play a chord to start your line</div>
      <div class="sev none" id="sevList"></div>
    </div>
    <div class="ctl">
      <label>Key <select id="keySel" aria-label="Key: automatic or set by hand"><option value="auto" id="keyName">Auto</option></select></label>
      <label>Style <select id="styleSel" aria-label="Harmonic style"><option value="neutral">Neutral</option><option value="pop">Pop</option><option value="jazz">Jazz</option></select></label>
      <button type="button" id="clearBtn">Clear</button>
      <span class="status" id="status">Mic off</span>
      <button type="button" id="demoBtn" title="Play a looping progression in the current key through the speakers, as if someone were playing">Demo</button>
      <button type="button" id="micBtn">Listen</button>
    </div>
  </header>
  <div class="stage">
    <svg id="map" viewBox="0 0 1300 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Your chords as a transit line: past stations to the left, branches to possible next chords on the right">
      <g id="world"></g>
    </svg>
  </div>
  <footer class="foot">
    <div class="legend"><span><i class="ink"></i>in the key</span><span><i class="maj"></i>borrowed or secondary</span><span><i class="here"></i>you are here</span><span>straight ahead = most likely, then outward by rank · thicker = more likely</span></div>
    <div id="readout"></div>
    <div class="quiet"><label>Mic level <input type="range" id="sens" min="1" max="100" value="45" aria-label="Microphone sensitivity"></label><label>Hear 7ths <input type="checkbox" id="sevenths" checked></label></div>
  </footer>
</div>

<script>
(function(){

  i:{iv:.85,V:.85,VI:.8,VII:.7,III:.6,v:.5,ii:.4},
  ii:{V:.9,i:.5,VI:.4,v:.3},
  III:{VI:.7,iv:.6,VII:.7,i:.6,V:.4},
  iv:{V:.9,i:.75,VI:.6,VII:.6,III:.4,v:.4},
  v:{i:.7,VI:.6,iv:.5,VII:.5,V:.4},
  V:{i:1,VI:.8,iv:.4,III:.35},
  VI:{VII:.8,iv:.7,III:.65,V:.7,i:.5,ii:.4},

  I:{iv:.5,VI:.4,V:.4,i:.3}, IV:{i:.6,VII:.5,V:.5}, '♭II':{V:.9,i:.5},

const DEFAULT_T_MAJ={I:.5,IV:.45,V:.5,vi:.4,ii:.35};

/* ---------- styles: each one overrides the transition tables, the base scores of colour chords, and the 7th habits ---------- */

  neutral:{label:'Neutral',T_MAJ:null,T_MIN:null,base:{},ext:{},adv:{}},
  pop:{label:'Pop',
    T_MAJ:{I:{IV:.95,V:.95,vi:.9,ii:.5,iii:.3},ii:{V:.8,IV:.55,I:.5,vi:.5,iii:.2},iii:{vi:.8,IV:.7,I:.4,V:.35,ii:.3},IV:{I:.9,V:.9,vi:.6,ii:.45,iii:.25},V:{I:1,vi:.85,IV:.7,ii:.3,iii:.25},vi:{IV:.95,V:.8,I:.6,ii:.55,iii:.3},

const tableFor=major=>{const st=style(); return major?(st.T_MAJ||T_MAJ):(st.T_MIN||T_MIN);};

const MOVE_WORD={'V→I':'authentic cadence','V→vi':'deceptive cadence','IV→I':'plagal cadence','ii→V':'ii–V','I→IV':'to the subdominant','I→V':'to the dominant','iv→I':'minor plagal','I→vi':'to the relative minor','V→i':'cadence','iv→V':'to the dominant','VII→III':'to the relative major','VI→VII':'♭VI–♭VII climb','i→VI':'to the submediant'};

/* ---------- key inference from the lifeline ---------- */

/* ---------- next-chord ranking ---------- */

const pcDist=(a,b)=>{const d=Math.abs(a-b)%12; return Math.min(d,12-d);};

}

const HARM=[1,.6,.4,.25,.15,.1];

const templates=[];
for(let pc=0;pc<12;pc++)for(const q of QUAL){

  let s=0; for(let i=0;i<12;i++)s+=t[i]*t[i]; s=Math.sqrt(s); for(let i=0;i<12;i++)t[i]/=s;

const seventhsBox=S('sevenths'), sens=S('sens'), micBtn=S('micBtn'), statusEl=S('status');

const smooth=new Float32Array(12), bassHist=new Float32Array(12);

function analyse(){

}

function demoList(){ // a loop in the current key: I vi IV V7, or i VI III VII in minor
  const k=key||{root:0,mode:'major'}, t=tonicOf(k), n=pc=>spell(pc,k.root);
  return k.mode==='major'?[n(t),n((t+9)%12)+'m',n((t+5)%12),n((t+7)%12)+'7']:[n(t)+'m',n((t+8)%12),n((t+3)%12),n((t+10)%12)];
}
async function start(list){
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=ctx.createAnalyser(); analyser.fftSize=8192; analyser.smoothingTimeConstant=0.45;
    freq=new Float32Array(analyser.frequencyBinCount); time=new Float32Array(analyser.fftSize);
    const test=list?list.join(','):new URLSearchParams(location.search).get('test');
    if(test){ runTest(test.split(',')); demoOn=!!list; }
    else{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); ctx.createMediaStreamSource(stream).connect(analyser); }
    if(ctx.state==='suspended') await ctx.resume();
    timer=setInterval(analyse,40);
    if(demoOn){ demoBtn.textContent='Stop demo'; demoBtn.classList.add('on'); setStatus('Demo loop · '+test.split(',').join(' '),'live'); }
    else { micBtn.textContent=test?'Stop test':'Stop'; micBtn.classList.add('on'); setStatus(test?'Test chords playing':'Listening','live'); }
  }catch(err){
    const denied=err&&(err.name==='NotAllowedError'||err.name==='SecurityError');
    setStatus(denied?'Microphone blocked here. Allow it in the browser, or open the local index.html file.':'Microphone unavailable: '+(err&&err.message||err),'err');
    stop(true);
  }
}
function stop(silent){
  if(timer)clearInterval(timer); timer=null;
  if(stream)stream.getTracks().forEach(t=>t.stop()); stream=null;
  testNodes.forEach(o=>{try{o.stop();}catch(e){}}); testNodes=[];
  if(ctx)ctx.close().catch(()=>{}); ctx=null; activeKey=null; activeExt='';
  micBtn.textContent='Listen'; micBtn.classList.remove('on'); demoBtn.textContent='Demo'; demoBtn.classList.remove('on'); demoOn=false;
  if(!silent) setStatus('Mic off');
}
micBtn.addEventListener('click',()=>{ if(timer&&!demoOn) stop(); else { if(timer) stop(); start(); } });
demoBtn.addEventListener('click',()=>{ if(demoOn) stop(); else { if(timer) stop(); start(demoList()); } });
if(new URLSearchParams(location.search).get('test')){ micBtn.textContent='Play test'; setStatus('Test mode'); }

/* ?test=C,Am7,Fmaj7,G7 plays synthetic chords through the detector, 2.5 s each */
function runTest(list){
  const gain=ctx.createGain(); gain.gain.value=0.15; gain.connect(analyser);
  const out=ctx.createGain(); out.gain.value=0.35; gain.connect(out); out.connect(ctx.destination);
  let i=0;
  const play=()=>{
    testNodes.forEach(o=>{try{o.stop();}catch(e){}}); testNodes=[];
    const name=list[i%list.length].trim(); i++;
    const m=/^([A-G][#b]?)(maj7|m7|m|7)?$/.exec(name); if(!m) return;
    const root=m[1], q=QUAL.find(x=>(x.ext||(x.minor?'m':''))===(m[2]||''));
    const pc=SHARP.indexOf(root)>=0?SHARP.indexOf(root):FLAT.indexOf(root);
    if(pc<0||!q) return;
    const oct=[48,60,48,60], t0=ctx.currentTime+0.18; // a short silence between chords so the detector settles
    q.iv.map((v,k)=>[pc+v,oct[k]]).concat([[pc,60]]).forEach(([p,base])=>{
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=440*Math.pow(2,(base-(base%12)+((p%12))-69)/12); o.connect(gain); o.start(t0); testNodes.push(o);
    });
  };
  play(); const iv=setInterval(()=>{if(!ctx){clearInterval(iv);return;}play();},2500);
}

recompute();
/* ?seed=C,Am,F,G7 composes a history by hand at load (no audio): handy for screenshots and sharing a progression */
{ const seed=new URLSearchParams(location.search).get('seed'); if(seed) seed.split(',').forEach(n=>{ const m=/^([A-G][#b]?)(maj7|m7|m|7)?$/.exec(n.trim()); if(!m) return; const pc=SHARP.indexOf(m[1])>=0?SHARP.indexOf(m[1]):FLAT.indexOf(m[1]); if(pc<0) return; const q=m[2]||''; playChord({pc,minor:q==='m'||q==='m7',ext:q==='m'?'':q},'clicked'); }); }
})();
