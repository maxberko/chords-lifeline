<style>
:root{

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;overflow:hidden}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
/* header */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;padding:0 24px;min-height:66px;border-bottom:1px solid var(--rule);background:var(--paper)}
.bar h1{font:italic 400 24px/1 var(--display);font-variation-settings:'SOFT' 100,'WONK' 1;margin:0;white-space:nowrap;color:var(--ink)}
.now{display:flex;align-items:baseline;gap:16px;min-width:0;overflow:hidden}
.now .chord{font:400 38px/1 var(--display);font-variation-settings:'SOFT' 100,'WONK' 1;white-space:nowrap;color:var(--ink)}
.now .chord.none{color:var(--ink-3);font-size:18px;font-family:var(--sans);font-style:italic;font-weight:400}
.now .chord .ext{font-size:.55em;margin-left:2px;vertical-align:.4em}
.now .acc,.now .sev .acc{font-family:'Noto Music',serif;font-size:.92em}
.now .role{font:500 16px/1.3 var(--sans);color:var(--ink-2);white-space:nowrap}
.now .role b{font-weight:700;color:var(--ink);margin-right:6px;letter-spacing:.02em}
.now .sev{display:flex;gap:12px;font:500 16px/1.3 var(--sans);color:var(--ink);white-space:nowrap;min-width:0;overflow:hidden}
.now .sev::before{content:'7ths that fit';color:var(--ink-3);font-style:italic;font-weight:400;margin-right:2px}
.now .sev.none{display:none}

.ctl{display:flex;align-items:center;gap:18px;white-space:nowrap}

.ctl select:focus-visible{outline:2px solid var(--bloom);outline-offset:3px}
.ctl button{font:500 15px var(--sans);border-radius:999px;padding:9px 16px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--ink-3)}
.ctl button:hover{border-color:var(--ink)}
.ctl button#micBtn{background:var(--bloom);color:#fff;border-color:var(--bloom);padding:10px 22px}
.ctl button#micBtn.on{background:var(--ink);border-color:var(--ink)}
.ctl button.on{border-color:var(--ink);background:var(--paper-2)}
.ctl button:focus-visible{outline:2px solid var(--bloom);outline-offset:3px}
.ctl .status{font:italic 400 13px var(--sans);color:var(--ink-3);white-space:nowrap} .ctl .status.live{color:var(--moss)} .ctl .status.err{color:var(--bloom);max-width:260px;white-space:normal}

.grain{opacity:.55;pointer-events:none}
.stem{fill:var(--ink)}
.st{cursor:pointer} .st .seed{fill:var(--ink)}

.sup{font-size:.62em;baseline-shift:super}

.tend:hover .why,.tend:focus-visible .why{opacity:1}

  <footer class="foot">
    <div class="legend"><span><i class="ink"></i>in the key</span><span><i class="rust"></i>borrowed or secondary</span><span><i class="here"></i>in bloom: now</span><span>thicker tendril = more likely · each bud = one semitone the voices travel</span></div>

</div>

for(let pc=0;pc<12;pc++)for(const q of QUAL){
  const t=new Float32Array(12); for(const v of q.iv) HARM.forEach((w,i)=>{t[(pc+v+Math.round(12*Math.log2(i+1)))%12]+=w;});
  let s=0; for(let i=0;i<12;i++)s+=t[i]*t[i]; s=Math.sqrt(s); for(let i=0;i<12;i++)t[i]/=s;
  templates.push({pc,minor:q.minor,ext:q.ext,t});
}
const seventhsBox=S('sevenths'), sens=S('sens'), micBtn=S('micBtn'), statusEl=S('status');
let ctx=null, analyser=null, stream=null, timer=null, freq=null, time=null, testNodes=[];
const smooth=new Float32Array(12), bassHist=new Float32Array(12);
let candidate=null, candSince=0, lastSound=0, lastFrame=0, activeKey=null, activeExt='';

function analyse(){
  analyser.getFloatTimeDomainData(time); analyser.getFloatFrequencyData(freq);
  let rms=0; for(let i=0;i<time.length;i++)rms+=time[i]*time[i]; rms=Math.sqrt(rms/time.length);
  const thr=Math.pow(10,(-22-sens.value*0.5)/20);
  const now=performance.now(), dt=Math.min(1000,now-(lastFrame||now)); lastFrame=now;
  const alpha=1-Math.exp(-dt/110);
  if(rms<thr){ for(let i=0;i<12;i++)smooth[i]*=(1-alpha); return; }
  lastSound=now;
  const binHz=ctx.sampleRate/analyser.fftSize, lo=Math.max(2,Math.floor(50/binHz)), hi=Math.min(freq.length-2,Math.ceil(2400/binHz));
  let maxDb=-200; for(let i=lo;i<=hi;i++)if(freq[i]>maxDb)maxDb=freq[i];
  const floor=Math.max(-95,maxDb-42), chroma=new Float32Array(12);
  let bassPc=-1;
  for(let i=lo;i<=hi;i++){
    const b=freq[i]; if(b<floor||b<=freq[i-1]||b<freq[i+1]) continue;
    const a=freq[i-1],c=freq[i+1], den=a-2*b+c, p=den?0.5*(a-c)/den:0;
    const f=(i+p)*binHz, midi=69+12*Math.log2(f/440), pcl=((Math.round(midi)%12)+12)%12;
    chroma[pcl]+=Math.pow(Math.pow(10,b/20),0.6);
    if(bassPc<0&&f<420&&b>maxDb-22) bassPc=pcl;
  }
  for(let i=0;i<12;i++) bassHist[i]+=alpha*((i===bassPc?1:0)-bassHist[i]);
  let bassBest=-1,bv=.35; for(let i=0;i<12;i++)if(bassHist[i]>bv){bv=bassHist[i];bassBest=i;}
  let e=0; for(let i=0;i<12;i++)e+=chroma[i]*chroma[i]; e=Math.sqrt(e)||1;
  for(let i=0;i<12;i++) smooth[i]+=alpha*(chroma[i]/e-smooth[i]);
  let sn=0; for(let i=0;i<12;i++)sn+=smooth[i]*smooth[i]; sn=Math.sqrt(sn)||1;
  let best=null,bs=-1,second=-1; const use7=seventhsBox.checked;
  for(const tp of templates){ if(tp.ext&&!use7) continue; let d=0;for(let i=0;i<12;i++)d+=smooth[i]*tp.t[i];d/=sn; if(tp.pc===bassBest)d+=.05; if(d>bs){second=bs;bs=d;best=tp;}else if(d>second)second=d; }
  if(bs<0.62) return;
  const fam=ckey(best.pc,best.minor), full=fam+'|'+best.ext;
  if(fam===activeKey&&best.ext===activeExt){ candidate=null; return; }
  if(candidate!==full){ candidate=full; candSince=now; }
  const need=fam!==activeKey?70:(best.ext?220:450);
  if(now-candSince>=need||(fam!==activeKey&&bs-second>.12)){ activeKey=fam; activeExt=best.ext; candidate=null; playChord({pc:best.pc,minor:best.minor,ext:best.ext},'heard'); }
}
function setStatus(t,c){statusEl.textContent=t;statusEl.className='status'+(c?' '+c:'');}
let demoOn=false;
const demoBtn=S('demoBtn');
function demoList(){ // a loop in the current key: I vi IV V7, or i VI III VII in minor
  const k=key||{root:0,mode:'major'}, t=tonicOf(k), n=pc=>spell(pc,k.root);
  return k.mode==='major'?[n(t),n((t+9)%12)+'m',n((t+5)%12),n((t+7)%12)+'7']:[n(t)+'m',n((t+8)%12),n((t+3)%12),n((t+10)%12)];
}
async function start(list){
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=ctx.createAnalyser(); analyser.fftSize=8192; analyser.smoothingTimeConstant=0.45;
    freq=new Float32Array(analyser.frequencyBinCount); time=new Float32Array(analyser.fftSize);
    const test=list?list.join(','):new URLSearchParams(location.search).get('test');
    if(test){ runTest(test.split(',')); demoOn=!!list; }
    else{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); ctx.createMediaStreamSource(stream).connect(analyser); }
    if(ctx.state==='suspended') await ctx.resume();
    timer=setInterval(analyse,40);
    if(demoOn){ demoBtn.textContent='Stop demo'; demoBtn.classList.add('on'); setStatus('Demo loop · '+test.split(',').join(' '),'live'); }
    else { micBtn.textContent=test?'Stop test':'Stop'; micBtn.classList.add('on'); setStatus(test?'Test chords playing':'Listening','live'); }
  }catch(err){
    const denied=err&&(err.name==='NotAllowedError'||err.name==='SecurityError');
    setStatus(denied?'Microphone blocked here. Allow it in the browser, or open the local index.html file.':'Microphone unavailable: '+(err&&err.message||err),'err');
    stop(true);
  }
}
function stop(silent){
  if(timer)clearInterval(timer); timer=null;
  if(stream)stream.getTracks().forEach(t=>t.stop()); stream=null;
  testNodes.forEach(o=>{try{o.stop();}catch(e){}}); testNodes=[];
  if(ctx)ctx.close().catch(()=>{}); ctx=null; activeKey=null; activeExt='';
  micBtn.textContent='Listen'; micBtn.classList.remove('on'); demoBtn.textContent='Demo'; demoBtn.classList.remove('on'); demoOn=false;
  if(!silent) setStatus('Mic off');
}
micBtn.addEventListener('click',()=>{ if(timer&&!demoOn) stop(); else { if(timer) stop(); start(); } });
demoBtn.addEventListener('click',()=>{ if(demoOn) stop(); else { if(timer) stop(); start(demoList()); } });
if(new URLSearchParams(location.search).get('test')){ micBtn.textContent='Play test'; setStatus('Test mode'); }

/* ?test=C,Am7,Fmaj7,G7 plays synthetic chords through the detector, 2.5 s each */
function runTest(list){
  const gain=ctx.createGain(); gain.gain.value=0.15; gain.connect(analyser);
  const out=ctx.createGain(); out.gain.value=0.35; gain.connect(out); out.connect(ctx.destination);
  let i=0;
  const play=()=>{
    testNodes.forEach(o=>{try{o.stop();}catch(e){}}); testNodes=[];
    const name=list[i%list.length].trim(); i++;
    const m=/^([A-G][#b]?)(maj7|m7|m|7)?$/.exec(name); if(!m) return;
    const root=m[1], q=QUAL.find(x=>(x.ext||(x.minor?'m':''))===(m[2]||''));
    const pc=SHARP.indexOf(root)>=0?SHARP.indexOf(root):FLAT.indexOf(root);
    if(pc<0||!q) return;
    const oct=[48,60,48,60], t0=ctx.currentTime+0.18; // a short silence between chords so the detector settles
    q.iv.map((v,k)=>[pc+v,oct[k]]).concat([[pc,60]]).forEach(([p,base])=>{
      const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=440*Math.pow(2,(base-(base%12)+((p%12))-69)/12); o.connect(gain); o.start(t0); testNodes.push(o);
    });
  };
  play(); const iv=setInterval(()=>{if(!ctx){clearInterval(iv);return;}play();},2500);
}

recompute();
/* ?seed=C,Am,F,G7 composes a history by hand at load (no audio): handy for screenshots and sharing a progression */
{ const seed=new URLSearchParams(location.search).get('seed'); if(seed) seed.split(',').forEach(n=>{ const m=/^([A-G][#b]?)(maj7|m7|m|7)?$/.exec(n.trim()); if(!m) return; const pc=SHARP.indexOf(m[1])>=0?SHARP.indexOf(m[1]):FLAT.indexOf(m[1]); if(pc<0) return; const q=m[2]||''; playChord({pc,minor:q==='m'||q==='m7',ext:q==='m'?'':q},'clicked'); }); }
})();
</script>
